name: Build DEEP MIND AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'
          cache: true

      - name: Check Flutter source files
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml is missing."
            exit 1
          fi

          if [ ! -f "lib/main.dart" ]; then
            echo "ERROR: lib/main.dart is missing."
            exit 1
          fi

          echo "Flutter source files found."

      - name: Generate Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder is missing. Creating Android scaffold."

            flutter create \
              --project-name deep_mind_ai \
              --org com.deepmindai \
              --platforms android \
              /tmp/deep_mind_scaffold

            cp -R /tmp/deep_mind_scaffold/android ./android
          else
            echo "Android folder already exists. Keeping existing files."
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEEP-MIND-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14





