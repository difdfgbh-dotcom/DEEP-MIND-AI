import 'dart:convert';

import 'package:flutter/material.dart';
import 'package:http/http.dart' as http;

const String apiBaseUrl = String.fromEnvironment(
  'API_BASE_URL',
  defaultValue: '',
);

void main() {
  WidgetsFlutterBinding.ensureInitialized();
  runApp(const DeepMindApp());
}

class DeepMindApp extends StatelessWidget {
  const DeepMindApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'DEEP MIND AI',
      debugShowCheckedModeBanner: false,
      theme: ThemeData(
        useMaterial3: true,
        brightness: Brightness.dark,
        scaffoldBackgroundColor: const Color(0xFF10131C),
        colorScheme: ColorScheme.fromSeed(
          seedColor: const Color(0xFF00C8B4),
          brightness: Brightness.dark,
        ),
        appBarTheme: const AppBarTheme(
          backgroundColor: Color(0xFF171D2A),
          foregroundColor: Colors.white,
          elevation: 0,
        ),
      ),
      home: const ChatScreen(),
    );
  }
}

class ChatMessage {
  final String text;
  final bool isUser;
  final DateTime time;

  const ChatMessage({
    required this.text,
    required this.isUser,
    required this.time,
  });
}

class ChatScreen extends StatefulWidget {
  const ChatScreen({super.key});

  @override
  State<ChatScreen> createState() => _ChatScreenState();
}

class _ChatScreenState extends State<ChatScreen> {
  final TextEditingController _messageController = TextEditingController();
  final ScrollController _scrollController = ScrollController();
  final FocusNode _inputFocusNode = FocusNode();

  final List<ChatMessage> _messages = <ChatMessage>[];

  bool _isLoading = false;
  bool _isArabic = true;

  String get _appTitle => 'DEEP MIND AI';

  String get _welcomeMessage {
    return _isArabic
        ? 'مرحباً بك في DEEP MIND AI!\nكيف يمكنني مساعدتك اليوم؟'
        : 'Willkommen bei DEEP MIND AI!\nWie kann ich dir heute helfen?';
  }

  String get _inputHint {
    return _isArabic ? 'اكتب رسالتك هنا...' : 'Schreibe deine Nachricht...';
  }

  String get _thinkingText {
    return _isArabic ? 'جاري التفكير...' : 'Denke nach...';
  }

  String get _serverNotConnectedMessage {
    return _isArabic
        ? 'لم يتم ربط خادم الذكاء الاصطناعي بعد.\nيرجى إعداد خادم FastAPI وربطه بالتطبيق.'
        : 'Der KI-Server ist noch nicht verbunden.\nBitte richte den FastAPI-Server ein.';
  }

  String get _connectionErrorMessage {
    return _isArabic
        ? 'تعذر الاتصال بالخادم.\nتحقق من الإنترنت ومن تشغيل الخادم.'
        : 'Verbindung zum Server fehlgeschlagen.\nBitte überprüfe deine Internetverbindung und den Server.';
  }

  String get _unexpectedResponseMessage {
    return _isArabic
        ? 'وصل رد من الخادم، لكن تنسيقه غير متوقع.'
        : 'Der Server hat eine unerwartete Antwort gesendet.';
  }

  @override
  void initState() {
    super.initState();
    _addWelcomeMessage();
  }

  @override
  void dispose() {
    _messageController.dispose();
    _scrollController.dispose();
    _inputFocusNode.dispose();
    super.dispose();
  }

  void _addWelcomeMessage() {
    _messages.clear();
    _messages.add(
      ChatMessage(
        text: _welcomeMessage,
        isUser: false,
        time: DateTime.now(),
      ),
    );
  }

  void _changeLanguage() {
    setState(() {
      _isArabic = !_isArabic;
      _addWelcomeMessage();
    });
  }

  void _clearChat() {
    setState(() {
      _addWelcomeMessage();
    });
  }

  Future<void> _sendMessage() async {
    final String message = _messageController.text.trim();

    if (message.isEmpty || _isLoading) {
      return;
    }

    _messageController.clear();
    _inputFocusNode.unfocus();

    setState(() {
      _messages.add(
        ChatMessage(
          text: message,
          isUser: true,
          time: DateTime.now(),
        ),
      );
      _isLoading = true;
    });

    _scrollToBottom();

    final String answer = await _getAIResponse(message);

    if (!mounted) {
      return;
    }

    setState(() {
      _messages.add(
        ChatMessage(
          text: answer,
          isUser: false,
          time: DateTime.now(),
        ),
      );
      _isLoading = false;
    });

    _scrollToBottom();
  }

  Future<String> _getAIResponse(String message) async {
    if (apiBaseUrl.trim().isEmpty) {
      return _serverNotConnectedMessage;
    }

    try {
      final String cleanBaseUrl =
          apiBaseUrl.trim().replaceAll(RegExp(r'/+$'), '');

      final Uri url = Uri.parse('$cleanBaseUrl/chat');

      final http.Response response = await http
          .post(
            url,
            headers: const <String, String>{
              'Content-Type': 'application/json; charset=utf-8',
              'Accept': 'application/json',
            },
            body: jsonEncode(<String, String>{
              'message': message,
            }),
          )
          .timeout(const Duration(seconds: 60));

      if (response.statusCode >= 200 && response.statusCode < 300) {
        final String responseBody = utf8.decode(response.bodyBytes);

        final dynamic decodedData = jsonDecode(responseBody);

        if (decodedData is Map<String, dynamic>) {
          final dynamic result = decodedData['response'] ??
              decodedData['reply'] ??
              decodedData['answer'] ??
              decodedData['message'];

          if (result != null && result.toString().trim().isNotEmpty) {
            return result.toString();
          }
        }

        return _unexpectedResponseMessage;
      }

      return _isArabic
          ? 'حدث خطأ في الخادم.\nرمز الخطأ: ${response.statusCode}'
          : 'Serverfehler.\nFehlercode: ${response.statusCode}';
    } catch (error) {
      return _connectionErrorMessage;
    }
  }

  void _scrollToBottom() {
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted) {
        return;
      }

      if (_scrollController.hasClients) {
        _scrollController.animateTo(
          _scrollController.position.maxScrollExtent,
          duration: const Duration(milliseconds: 300),
          curve: Curves.easeOut,
        );
      }
    });
  }

  Widget _buildMessageBubble(ChatMessage message) {
    final bool isUser = message.isUser;

    return Align(
      alignment: isUser ? Alignment.centerRight : Alignment.centerLeft,
      child: Container(
        margin: const EdgeInsets.symmetric(
          horizontal: 12,
          vertical: 6,
        ),
        padding: const EdgeInsets.symmetric(
          horizontal: 14,
          vertical: 12,
        ),
        constraints: const BoxConstraints(
          maxWidth: 320,
        ),
        decoration: BoxDecoration(
          color: isUser ? const Color(0xFF087F78) : const Color(0xFF222938),
          borderRadius: BorderRadius.only(
            topLeft: const Radius.circular(18),
            topRight: const Radius.circular(18),
            bottomLeft: Radius.circular(isUser ? 18 : 4),
            bottomRight: Radius.circular(isUser ? 4 : 18),
          ),
        ),
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          mainAxisSize: MainAxisSize.min,
          children: [
            Text(
              message.text,
              textDirection:
                  _isArabic ? TextDirection.rtl : TextDirection.ltr,
              style: const TextStyle(
                color: Colors.white,
                fontSize: 16,
                height: 1.45,
              ),
            ),
            const SizedBox(height: 6),
            Text(
              '${message.time.hour.toString().padLeft(2, '0')}:${message.time.minute.toString().padLeft(2, '0')}',
              style: TextStyle(
                color: Colors.white.withOpacity(0.6),
                fontSize: 11,
              ),
            ),
          ],
        ),
      ),
    );
  }

  Widget _buildChatList() {
    if (_messages.isEmpty) {
      return Center(
        child: Text(
          _isArabic ? 'لا توجد رسائل بعد.' : 'Noch keine Nachrichten.',
          style: const TextStyle(
            color: Colors.white70,
          ),
        ),
      );
    }

    return ListView.builder(
      controller: _scrollController,
      padding: const EdgeInsets.only(
        top: 12,
        bottom: 12,
      ),
      itemCount: _messages.length,
      itemBuilder: (BuildContext context, int index) {
        return _buildMessageBubble(_messages[index]);
      },
    );
  }

  Widget _buildLoadingIndicator() {
    if (!_isLoading) {
      return const SizedBox.shrink();
    }

    return Padding(
      padding: const EdgeInsets.symmetric(
        horizontal: 16,
        vertical: 8,
      ),
      child: Row(
        children: [
          const SizedBox(
            width: 18,
            height: 18,
            child: CircularProgressIndicator(
              strokeWidth: 2,
              color: Color(0xFF00D6BD),
            ),
          ),
          const SizedBox(width: 12),
          Text(
            _thinkingText,
            style: const TextStyle(
              color: Colors.white70,
            ),
          ),
        ],
      ),
    );
  }

  Widget _buildInputArea() {
    return Container(
      padding: const EdgeInsets.all(12),
      decoration: const BoxDecoration(
        color: Color(0xFF171D2A),
      ),
      child: SafeArea(
        top: false,
        child: Row(
          children: [
            Expanded(
              child: TextField(
                controller: _messageController,
                focusNode: _inputFocusNode,
                minLines: 1,
                maxLines: 5,
                keyboardType: TextInputType.multiline,
                textInputAction: TextInputAction.newline,
                textDirection:
                    _isArabic ? TextDirection.rtl : TextDirection.ltr,
                style: const TextStyle(
                  color: Colors.white,
                ),
                decoration: InputDecoration(
                  hintText: _inputHint,
                  hintStyle: const TextStyle(
                    color: Colors.white54,
                  ),
                  filled: true,
                  fillColor: const Color(0xFF252D3C),
                  border: OutlineInputBorder(
                    borderRadius: BorderRadius.circular(25),
                    borderSide: BorderSide.none,
                  ),
                  contentPadding: const EdgeInsets.symmetric(
                    horizontal: 18,
                    vertical: 12,
                  ),
                ),
                onSubmitted: (String value) {
                  _sendMessage();
                },
              ),
            ),
            const SizedBox(width: 8),
            CircleAvatar(
              radius: 24,
              backgroundColor: const Color(0xFF00A99A),
              child: IconButton(
                onPressed: _isLoading ? null : _sendMessage,
                icon: const Icon(
                  Icons.send,
                  color: Colors.white,
                ),
              ),
            ),
          ],
        ),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Directionality(
      textDirection: _isArabic ? TextDirection.rtl : TextDirection.ltr,
      child: Scaffold(
        appBar: AppBar(
          title: Row(
            children: [
              const Icon(
                Icons.auto_awesome,
                color: Color(0xFF00D6BD),
              ),
              const SizedBox(width: 10),
              Expanded(
                child: Text(
                  _appTitle,
                  overflow: TextOverflow.ellipsis,
                  style: const TextStyle(
                    fontWeight: FontWeight.bold,
                    fontSize: 18,
                  ),
                ),
              ),
            ],
          ),
          actions: [
            IconButton(
              tooltip: _isArabic ? 'Deutsch' : 'العربية',
              onPressed: _changeLanguage,
              icon: const Icon(Icons.language),
            ),
            IconButton(
              tooltip: _isArabic ? 'محادثة جديدة' : 'Neuer Chat',
              onPressed: _clearChat,
              icon: const Icon(Icons.delete_outline),
            ),
          ],
        ),
        body: Column(
          children: [
            Expanded(
              child: _buildChatList(),
            ),
            _buildLoadingIndicator(),
            _buildInputArea(),
          ],
        ),
      ),
    );
  }
}





