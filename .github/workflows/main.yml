
name: Build DEEP MIND AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'
          cache: true

      - name: Install Flutter dependencies
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "name: deep_mind_ai" > pubspec.yaml
            echo "dependencies:" >> pubspec.yaml
            echo "  flutter:" >> pubspec.yaml
            echo "    sdk: flutter" >> pubspec.yaml
            echo "  http: ^1.1.0" >> pubspec.yaml
            echo "flutter:" >> pubspec.yaml
            echo "  uses-material-design: true" >> pubspec.yaml
          fi
          flutter pub get

      - name: Create Main Dart File
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          ${{ secrets.MAIN_DART_CODE }}
          EOF
          if [ ! -s "lib/main.dart" ] || grep -q "MAIN_DART_CODE" "lib/main.dart"; then
            echo "Writing default fallback code..."
            cat << 'EOF' > lib/main.dart
            import 'package:flutter/material.dart';
            void main() => runApp(MaterialApp(home: Scaffold(body: Center(child: Text('DEEP MIND AI')))));
            EOF
          fi

      - name: Generate Android Scaffold
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms android .
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEEP-MIND-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14


